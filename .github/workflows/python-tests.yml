name: Python tests

on:
  push:
    branches:
      - master
    paths:
      - multicast-relay.py
      - test_PacketRelay.py
      - .github/workflows/python-tests.yml
  pull_request:
    paths:
      - multicast-relay.py
      - test_PacketRelay.py
      - .github/workflows/python-tests.yml
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run unit tests
        run: python -m pytest -q test_PacketRelay.py
