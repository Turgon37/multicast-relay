name: CI

on:
  pull_request:
    paths:
      - Dockerfile
      - multicast-relay.py
      - ssdpDiscover.py
      - test_PacketRelay.py
      - test_ssdpDiscover.py
      - requirements-dev.txt
      - ruff.toml
      - chart/**
      - artifacthub-repo.yml
      - renovate.json
      - .github/workflows/**
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONLINT_VERSION: 1.7.7

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          mkdir -p /tmp/actionlint
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- "$ACTIONLINT_VERSION" /tmp/actionlint

      - name: Lint GitHub Actions workflows
        run: /tmp/actionlint/actionlint -color

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Run ruff
        run: python -m ruff check multicast-relay.py ssdpDiscover.py test_PacketRelay.py test_ssdpDiscover.py

      - name: Run unit tests
        run: python -m pytest -q test_PacketRelay.py test_ssdpDiscover.py

      - name: Check Python syntax
        env:
          PYTHONPYCACHEPREFIX: /tmp/pycache
        run: python -m py_compile multicast-relay.py ssdpDiscover.py test_PacketRelay.py test_ssdpDiscover.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint chart --values chart/ci/lint-values.yaml
