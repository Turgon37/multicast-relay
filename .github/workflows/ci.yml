name: CI

on:
  pull_request:
    paths:
      - Dockerfile
      - multicast-relay.py
      - ssdpDiscover.py
      - test_PacketRelay.py
      - test_ssdpDiscover.py
      - requirements-dev.txt
      - ruff.toml
      - chart/**
      - artifacthub-repo.yml
      - renovate.json
      - .github/workflows/**
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONLINT_VERSION: 1.7.12

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install actionlint
        run: |
          mkdir -p /tmp/actionlint
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- "$ACTIONLINT_VERSION" /tmp/actionlint

      - name: Lint GitHub Actions workflows
        run: /tmp/actionlint/actionlint -color

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Run ruff
        run: python -m ruff check ssdpDiscover.py test_ssdpDiscover.py

      - name: Run unit tests
        run: python -m pytest -q test_PacketRelay.py test_ssdpDiscover.py

      - name: Check Python syntax
        env:
          PYTHONPYCACHEPREFIX: /tmp/pycache
        run: python -m py_compile multicast-relay.py ssdpDiscover.py test_PacketRelay.py test_ssdpDiscover.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Lint Helm chart
        run: helm lint chart --values chart/ci/lint-values.yaml
