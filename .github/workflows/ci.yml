name: CI

on:
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - multicast-relay.py
      - test_PacketRelay.py
      - chart/**
      - artifacthub-repo.yml
      - .github/workflows/**
  pull_request:
    paths:
      - Dockerfile
      - multicast-relay.py
      - test_PacketRelay.py
      - chart/**
      - artifacthub-repo.yml
      - .github/workflows/**
  workflow_call:

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.7

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- "$ACTIONLINT_VERSION" /tmp/actionlint

      - name: Lint GitHub Actions workflows
        run: /tmp/actionlint/actionlint -color

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run unit tests
        run: python -m pytest -q test_PacketRelay.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint chart --values chart/ci/lint-values.yaml
