name: Build and publish Docker image

on:
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - multicast-relay.py
      - ssdpDiscover.py
      - chart/Chart.yaml
      - .github/workflows/docker-image.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      version: ${{ steps.detect.outputs.version }}
      appversion_changed: ${{ steps.detect.outputs.appversion_changed }}
      major_minor: ${{ steps.detect.outputs.major_minor }}
      major: ${{ steps.detect.outputs.major }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Docker release inputs
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          before = os.environ.get('BEFORE', '')
          sha = os.environ['GITHUB_SHA']
          zero = '0' * 40
          changed_files = []
          if os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch':
              changed = True
              appversion_changed = True
          else:
              if before and before != zero:
                  diff = subprocess.run(
                      ['git', 'diff', '--name-only', before, sha],
                      capture_output=True,
                      text=True,
                      check=True,
                  )
                  changed_files = diff.stdout.splitlines()
              else:
                  changed_files = ['Dockerfile', 'multicast-relay.py', 'chart/Chart.yaml']

              docker_changed = any(path in {'Dockerfile', 'multicast-relay.py'} for path in changed_files)

              chart = Path('chart/Chart.yaml').read_text()
              prev_app = None
              if before and before != zero:
                  prev = subprocess.run(
                      ['git', 'show', f'{before}:chart/Chart.yaml'],
                      capture_output=True,
                      text=True,
                  )
                  if prev.returncode == 0:
                      match = re.search(r'^appVersion:\s*"?([^\n"]+)"?', prev.stdout, re.M)
                      if match:
                          prev_app = match.group(1)

              current_app = re.search(r'^appVersion:\s*"?([^\n"]+)"?', chart, re.M).group(1)
              appversion_changed = current_app != prev_app
              changed = docker_changed or appversion_changed

          current_app = re.search(r'^appVersion:\s*"?([^\n"]+)"?', Path('chart/Chart.yaml').read_text(), re.M).group(1)
          major, minor, *_ = current_app.split('.')
          major_minor = f'{major}.{minor}'

          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f'changed={"true" if changed else "false"}\n')
              fh.write(f'version={current_app}\n')
              fh.write(f'appversion_changed={"true" if appversion_changed else "false"}\n')
              fh.write(f'major_minor={major_minor}\n')
              fh.write(f'major={major}\n')

          print(f'changed={changed} version={current_app} major_minor={major_minor} major={major}')
          PY

  docker:
    needs:
      - validate
      - detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image version bump
        if: github.event_name == 'push'
        run: |
          if [ "${{ needs.detect.outputs.appversion_changed }}" != "true" ]; then
            echo "chart/Chart.yaml appVersion must be bumped before publishing"
            exit 1
          fi

      - name: Generate Docker image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/turgon37/multicast-relay
          tags: |
            type=raw,value=${{ needs.detect.outputs.version }}
            type=raw,value=${{ needs.detect.outputs.major_minor }}
            type=raw,value=${{ needs.detect.outputs.major }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4

      - name: Sign Docker image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/turgon37/multicast-relay@${IMAGE_DIGEST}"

      - name: Prepare GitHub Release assets
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ['VERSION']
          digest = os.environ['DIGEST']
          payload = {
              'type': 'docker-image',
              'tag': f'v{version}',
              'version': version,
              'image': 'ghcr.io/turgon37/multicast-relay',
              'digest': digest,
              'source': os.environ['GITHUB_SHA'],
          }
          Path('/tmp/docker-release.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          Path('/tmp/docker-release-notes.md').write_text(
              f'Docker image release v{version}\n\n'
              f'Image: ghcr.io/turgon37/multicast-relay@{digest}\n'
          )
          PY
          cosign sign-blob --yes \
            --output-signature /tmp/docker-release.json.sig \
            --output-certificate /tmp/docker-release.json.pem \
            /tmp/docker-release.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already exists"
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              /tmp/docker-release.json \
              /tmp/docker-release.json.sig \
              /tmp/docker-release.json.pem \
              --clobber
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file /tmp/docker-release-notes.md \
              /tmp/docker-release.json \
              /tmp/docker-release.json.sig \
              /tmp/docker-release.json.pem
          fi
