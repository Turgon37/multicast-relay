name: Build and publish Docker image

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  release:
    needs:
      - validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major_minor=$MAJOR.$MINOR" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

      - name: Verify image version bump
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import os
          from pathlib import Path

          version = os.environ['IMAGE_VERSION']

          def read_field(text, key):
              match = re.search(rf'^{key}:\s*"?([^\n"]+)"?', text, re.M)
              if not match:
                  raise SystemExit(f'missing {key}')
              return match.group(1)

          chart = Path('chart/Chart.yaml').read_text()
          values = Path('chart/values.yaml').read_text()
          app_version = read_field(chart, 'appVersion')
          image_tag = read_field(values, 'tag')

          if version != app_version:
              raise SystemExit(f'tag version {version} does not match chart appVersion {app_version}')
          if version != image_tag:
              raise SystemExit(f'tag version {version} does not match chart image.tag {image_tag}')
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/turgon37/multicast-relay
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major_minor }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign Docker image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/turgon37/multicast-relay@${IMAGE_DIGEST}"

      - name: Prepare GitHub Release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ['VERSION']
          digest = os.environ['DIGEST']
          payload = {
              'type': 'docker-image',
              'tag': f'v{version}',
              'version': version,
              'image': 'ghcr.io/turgon37/multicast-relay',
              'digest': digest,
              'source': os.environ['GITHUB_SHA'],
          }
          Path('/tmp/docker-release.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          Path('/tmp/docker-release-notes.md').write_text(
              f'Docker image release v{version}\n\n'
              f'Image: ghcr.io/turgon37/multicast-relay@{digest}\n'
          )
          PY
          cosign sign-blob --yes \
            --bundle /tmp/docker-release.json.bundle \
            /tmp/docker-release.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              /tmp/docker-release.json \
              /tmp/docker-release.json.bundle \
              --clobber
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file /tmp/docker-release-notes.md \
              /tmp/docker-release.json \
              /tmp/docker-release.json.bundle
          fi
