name: Build and publish Docker image

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  id-token: write
  pull-requests: write
  packages: write

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          {
            echo "version=$VERSION"
            echo "major_minor=$MAJOR.$MINOR"
            echo "major=$MAJOR"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/turgon37/multicast-relay
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major_minor }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign Docker image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/turgon37/multicast-relay@${IMAGE_DIGEST}"

      - name: Prepare GitHub Release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ['VERSION']
          digest = os.environ['DIGEST']
          payload = {
              'type': 'docker-image',
              'tag': f'v{version}',
              'version': version,
              'image': 'ghcr.io/turgon37/multicast-relay',
              'digest': digest,
              'source': os.environ['GITHUB_SHA'],
          }
          Path('/tmp/docker-release.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          Path('/tmp/docker-release-notes.md').write_text(
              f'Docker image release v{version}\n\n'
              f'Image: ghcr.io/turgon37/multicast-relay@{digest}\n'
          )
          PY
          cosign sign-blob --yes \
            --bundle /tmp/docker-release.json.bundle \
            /tmp/docker-release.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              /tmp/docker-release.json \
              /tmp/docker-release.json.bundle \
              --clobber
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file /tmp/docker-release-notes.md \
              /tmp/docker-release.json \
              /tmp/docker-release.json.bundle
          fi

      - name: Install helm-docs
        env:
          HELM_DOCS_VERSION: v1.14.2
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/helm-docs.tar.gz \
            "https://github.com/norwoodj/helm-docs/releases/download/${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION#v}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/helm-docs.tar.gz -C /tmp helm-docs
          sudo install -m 0755 /tmp/helm-docs /usr/local/bin/helm-docs

      - name: Open chart bump PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "RELEASE_BOT_TOKEN is required to open the chart bump PR"
            echo "The chart bump branch was still pushed to origin."
            exit 0
          fi
          BRANCH="chore/chart-appversion-v${VERSION}"
          git fetch origin master
          git checkout -B "${BRANCH}" origin/master

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ['VERSION']

          chart_path = Path('chart/Chart.yaml')
          values_path = Path('chart/values.yaml')

          def bump_patch(text):
              major, minor, patch = text.split('.')
              return f'{major}.{minor}.{int(patch) + 1}'

          chart_text = chart_path.read_text()
          chart_text = re.sub(
              r'(?m)^version:\s*.*$',
              lambda match: f'version: {bump_patch(match.group(0).split(": ", 1)[1])}',
              chart_text,
              count=1,
          )
          chart_text = re.sub(r'(?m)^appVersion:\s*.*$', f'appVersion: {version}', chart_text, count=1)
          chart_text = re.sub(
              r'(?m)^      image:\s*ghcr\.io/turgon37/multicast-relay:[^\n"]+$',
              f'      image: ghcr.io/turgon37/multicast-relay:{version}',
              chart_text,
              count=1,
          )
          chart_text = re.sub(
              r'(?m)^      description:\s*.*$',
              f'      description: Sync chart metadata with Docker image release v{version}.',
              chart_text,
              count=1,
          )
          chart_text = re.sub(
              r'(?ms)^  artifacthub\.io/changes: \|\n(?:.*\n)*?^keywords:$',
              f'''  artifacthub.io/changes: |
    - kind: changed
      description: Sync chart metadata with Docker image release v{version}.
      links:
        - name: Changelog
          url: https://github.com/Turgon37/multicast-relay/blob/master/CHANGELOG.md
keywords:''',
              chart_text,
              count=1,
          )
          chart_path.write_text(chart_text)

          values = values_path.read_text()
          values = re.sub(
              r'(?m)^(\s*tag:\s*).+$',
              lambda match: f'{match.group(1)}{version}',
              values,
              count=1,
          )
          values_path.write_text(values)
          PY

          helm-docs chart

          git add chart/Chart.yaml chart/values.yaml chart/README.md
          if git diff --cached --quiet; then
            echo "no chart bump changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(chart): bump chart for image ${VERSION}"
          git push --force-with-lease origin "${BRANCH}"

          PR_NUMBER="$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')"
          BODY=$(cat <<EOF
          Automated chart update after Docker image release v${VERSION}.

          This PR prepares the next chart release by updating:

          - chart/Chart.yaml version
          - chart/Chart.yaml appVersion
          - chart/Chart.yaml artifacthub.io/images
          - chart/Chart.yaml artifacthub.io/changes
          - chart/values.yaml image.tag
          - chart/README.md generated documentation

          The chart version is bumped independently from the Docker image tag.
          Merge this PR, then the chart workflow can publish the chart release
          from master.
          EOF
          )
          if [ -n "${PR_NUMBER}" ]; then
            gh pr edit "${PR_NUMBER}" \
              --title "chore(chart): prepare chart release for image ${VERSION}" \
              --body "${BODY}"
          else
            gh pr create \
              --base master \
              --head "${BRANCH}" \
              --title "chore(chart): prepare chart release for image ${VERSION}" \
              --body "${BODY}"
          fi
