name: Package and publish Helm chart

on:
  push:
    branches:
      - master
    paths:
      - chart/**
      - .github/workflows/helm-chart.yml
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: helm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    uses: ./.github/workflows/chart-ci.yml

  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      version: ${{ steps.detect.outputs.version }}
      version_changed: ${{ steps.detect.outputs.version_changed }}
      appversion_changed: ${{ steps.detect.outputs.appversion_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect chart release inputs
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          before = os.environ.get('BEFORE', '')
          zero = '0' * 40
          current = Path('chart/Chart.yaml').read_text()

          def read_field(text, key):
              match = re.search(rf'^{key}:\s*"?([^\n"]+)"?', text, re.M)
              if not match:
                  raise SystemExit(f'missing {key}')
              return match.group(1)

          version = read_field(current, 'version')
          app_version = read_field(current, 'appVersion')

          if os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch':
              version_changed = True
              appversion_changed = True
              changed = True
          elif before and before != zero:
              previous = subprocess.run(
                  ['git', 'show', f'{before}:chart/Chart.yaml'],
                  capture_output=True,
                  text=True,
              )
              prev_text = previous.stdout if previous.returncode == 0 else ''
              prev_version = read_field(prev_text, 'version') if prev_text else None
              prev_app = read_field(prev_text, 'appVersion') if prev_text else None
              version_changed = version != prev_version
              appversion_changed = app_version != prev_app
              diff = subprocess.run(
                  ['git', 'diff', '--name-only', before, os.environ['GITHUB_SHA']],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              changed_files = diff.stdout.splitlines()
              chart_changed = any(path.startswith('chart/') for path in changed_files)
              changed = chart_changed or version_changed or appversion_changed
          else:
              version_changed = appversion_changed = changed = True

          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f'changed={"true" if changed else "false"}\n')
              fh.write(f'version={version}\n')
              fh.write(f'version_changed={"true" if version_changed else "false"}\n')
              fh.write(f'appversion_changed={"true" if appversion_changed else "false"}\n')

          print(f'version={version} version_changed={version_changed} appversion_changed={appversion_changed}')
          PY

  helm:
    needs:
      - validate
      - detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Install helm-docs
        env:
          HELM_DOCS_VERSION: v1.14.2
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/helm-docs.tar.gz \
            "https://github.com/norwoodj/helm-docs/releases/download/${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION#v}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/helm-docs.tar.gz -C /tmp helm-docs
          sudo install -m 0755 /tmp/helm-docs /usr/local/bin/helm-docs

      - name: Install oras
        uses: oras-project/setup-oras@v2
        with:
          version: 1.3.3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4

      - name: Lint Helm chart
        run: helm lint chart --values chart/ci/lint-values.yaml

      - name: Generate chart README
        run: helm-docs chart

      - name: Verify version bump
        if: github.event_name == 'push'
        run: |
          if [ "${{ needs.detect.outputs.version_changed }}" != "true" ]; then
            echo "chart/Chart.yaml version must be bumped before publishing"
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Helm registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package Helm chart
        run: |
          mkdir -p .helm
          helm package chart --destination .helm

      - name: Push Helm chart as OCI artifact
        id: push
        run: |
          output=$(helm push .helm/multicast-relay-*.tgz oci://ghcr.io/turgon37/charts)
          echo "$output"
          digest=$(echo "$output" | sed -n 's/^Digest: //p')
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign Helm chart
        run: cosign sign --yes ghcr.io/turgon37/charts/multicast-relay@${{ steps.push.outputs.digest }}

      - name: Prepare GitHub Release assets
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          PACKAGE="$(find .helm -maxdepth 1 -name 'multicast-relay-*.tgz' -print -quit)"
          test -n "$PACKAGE"
          export PACKAGE
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          package = Path(os.environ['PACKAGE'])
          version = os.environ['VERSION']
          digest = os.environ['DIGEST']
          payload = {
              'type': 'helm-chart',
              'tag': f'chart-v{version}',
              'version': version,
              'package': package.name,
              'oci': 'ghcr.io/turgon37/charts/multicast-relay',
              'digest': digest,
              'source': os.environ['GITHUB_SHA'],
          }
          Path('/tmp/chart-release.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          Path('/tmp/chart-release-notes.md').write_text(
              f'Helm chart release chart-v{version}\n\n'
              f'Chart package: {package.name}\n'
              f'OCI digest: {digest}\n'
          )
          PY
          cosign sign-blob --yes \
            --output-signature /tmp/chart-release.json.sig \
            --output-certificate /tmp/chart-release.json.pem \
            /tmp/chart-release.json
          cosign sign-blob --yes \
            --output-signature "${PACKAGE}.sig" \
            --output-certificate "${PACKAGE}.pem" \
            "${PACKAGE}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          PACKAGE="$(find .helm -maxdepth 1 -name 'multicast-relay-*.tgz' -print -quit)"
          test -n "$PACKAGE"
          TAG="chart-v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already exists"
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              "${PACKAGE}" \
              "${PACKAGE}.sig" \
              "${PACKAGE}.pem" \
              /tmp/chart-release.json \
              /tmp/chart-release.json.sig \
              /tmp/chart-release.json.pem \
              --clobber
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file /tmp/chart-release-notes.md \
              "${PACKAGE}" \
              "${PACKAGE}.sig" \
              "${PACKAGE}.pem" \
              /tmp/chart-release.json \
              /tmp/chart-release.json.sig \
              /tmp/chart-release.json.pem
          fi

      - name: Publish Artifact Hub repository metadata
        run: |
          oras push \
            ghcr.io/turgon37/charts/multicast-relay:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
